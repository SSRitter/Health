<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healthy Me 2.0</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>Healthy Me</h1><p>Meal planner + daily checklist</p></div><button id="resetTodayBtn">Reset Today</button></header><nav><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="planner">Planner</button><button class="tab" data-tab="library">Meal Library</button><button class="tab" data-tab="shopping">Shopping</button><button class="tab" data-tab="prep">Prep</button></nav><main><section id="today" class="panel active"><h2>Today</h2><p id="todayDate" class="muted"></p><div id="todayContent"></div></section><section id="planner" class="panel"><div class="head"><div><h2>Planner</h2><p class="muted">Tap a meal to swap it.</p></div><div class="actions"><div class="seg"><button data-view="day">Day</button><button data-view="week" class="active">Week</button><button data-view="month">Month</button></div><button id="jumpTodayBtn" class="primary">Jump to Today</button></div></div><div id="plannerContent"></div></section><section id="library" class="panel"><div class="head"><div><h2>Meal Library</h2><p class="muted">Add, edit, archive, or restore meals.</p></div><button id="addMealBtn" class="primary">+ Add Meal</button></div><div class="filters"><input id="mealSearch" placeholder="Search meals or ingredients"><select id="categoryFilter"><option value="All">All categories</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option value="Archived">Archived</option></select></div><div id="mealLibrary" class="grid"></div></section><section id="shopping" class="panel"><h2>Shopping List</h2><p class="muted">Generated from the meals in the current planner view.</p><div id="shoppingList" class="grid"></div></section><section id="prep" class="panel"><h2>Weekly Prep</h2><div id="prepList" class="card"></div></section></main><dialog id="swapDialog"><div class="dialog"><div class="dhead"><div><h3>Swap Meal</h3><p id="swapSlotLabel" class="muted"></p></div><button id="closeSwap">×</button></div><input id="swapSearch" placeholder="Search meals"><div id="swapChoices" class="choices"></div></div></dialog><dialog id="mealDialog"><form id="mealForm" class="dialog"><div class="dhead"><div><h3 id="mealDialogTitle">Add Meal</h3><p class="muted">Enter one ingredient per line.</p></div><button type="button" id="closeMeal">×</button></div><label>Name<input id="mealName" required></label><label>Category<select id="mealCategory"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label>Ingredients<textarea id="mealIngredients" rows="8" required></textarea></label><label>Notes<textarea id="mealNotes" rows="3"></textarea></label><div class="row"><button type="button" id="archiveMealBtn" class="danger hidden">Archive</button><span></span><button type="button" id="cancelMeal">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><script src="app.js"></script></body></html>
