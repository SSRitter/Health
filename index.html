<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healthy Me</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Healthy Me</h1>
      <p id="headerDate"></p>
    </div>
    <button id="resetToday" class="text-btn">Reset</button>
  </header>

  <main>
    <section id="today" class="screen active">
      <div id="todayList" class="list"></div>
    </section>

    <section id="plan" class="screen">
      <div class="screen-head">
        <div class="segmented">
          <button data-view="day">Day</button>
          <button data-view="week" class="active">Week</button>
          <button data-view="month">Month</button>
        </div>
        <button id="jumpToday" class="primary small">Today</button>
      </div>
      <div id="planner"></div>
    </section>

    <section id="meals" class="screen">
      <div class="screen-head">
        <input id="mealSearch" type="search" placeholder="Search meals">
        <button id="addMeal" class="primary">+ Add</button>
      </div>
      <div class="chips" id="mealFilters"></div>
      <div id="mealLibrary" class="list"></div>
    </section>

    <section id="shop" class="screen">
      <div class="screen-head">
        <h2>Shopping</h2>
        <button id="clearShop" class="text-btn">Clear checks</button>
      </div>
      <p class="hint">Built from the meals in the current planner view.</p>
      <div id="shoppingList" class="list"></div>
    </section>

    <section id="prep" class="screen">
      <h2>Prep</h2>
      <div id="prepList" class="list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="today">Today</button>
    <button class="nav-btn" data-screen="plan">Plan</button>
    <button class="nav-btn" data-screen="meals">Meals</button>
    <button class="nav-btn" data-screen="shop">Shop</button>
    <button class="nav-btn" data-screen="prep">Prep</button>
  </nav>

  <dialog id="swapDialog">
    <form method="dialog" class="sheet">
      <div class="sheet-head">
        <div>
          <h3>Choose meal</h3>
          <p id="swapLabel"></p>
        </div>
        <button value="cancel" class="icon-btn">×</button>
      </div>
      <input id="swapSearch" type="search" placeholder="Search">
      <div id="swapOptions" class="list"></div>
    </form>
  </dialog>

  <dialog id="mealDialog">
    <form id="mealForm" class="sheet">
      <div class="sheet-head">
        <h3 id="mealDialogTitle">Add meal</h3>
        <button type="button" id="closeMeal" class="icon-btn">×</button>
      </div>
      <label>Name<input id="mealName" required></label>
      <label>Category
        <select id="mealCategory">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Dinner</option>
          <option>Snack</option>
        </select>
      </label>
      <label>Ingredients, one per line<textarea id="mealIngredients" rows="8" required></textarea></label>
      <label>Notes<textarea id="mealNotes" rows="3"></textarea></label>
      <label class="toggle-row"><input id="mealFavorite" type="checkbox"> Favorite</label>
      <div class="form-actions">
        <button type="button" id="duplicateMeal" class="secondary hidden">Duplicate</button>
        <button type="button" id="archiveMeal" class="danger hidden">Archive</button>
        <span></span>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
